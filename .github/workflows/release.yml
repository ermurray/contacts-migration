name: Release

# Build installers for macOS, Windows, and Linux.
# - Push a tag like v1.0.0  -> builds all three and attaches them to a GitHub Release.
# - Manually run (workflow_dispatch) -> builds all three and uploads them as artifacts.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --mac
          - os: windows-latest
            args: --win
          - os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: gui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run core tests
        run: npm test

      - name: Build installers
        # No GH_TOKEN here on purpose: its presence makes electron-builder try to
        # configure GitHub publishing (even with --publish never) and crash with
        # "Cannot read properties of null (reading 'provider')". The release is
        # attached separately below.
        env:
          # No code-signing certificates in CI — build unsigned/ad-hoc.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx --no-install electron-builder ${{ matrix.args }} --publish never

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            gui/dist/*.dmg
            gui/dist/*.exe
            gui/dist/*.AppImage

      - name: Attach to GitHub Release (tagged builds)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          # tags containing a hyphen (e.g. v1.0.0-alpha.1) are marked pre-release
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            gui/dist/*.dmg
            gui/dist/*.exe
            gui/dist/*.AppImage
